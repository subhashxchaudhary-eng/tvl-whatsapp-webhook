name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (Render sleeps after 15)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed for the monthly keepalive commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the webhook server
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://tvl-whatsapp-webhook.onrender.com/)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Server did not answer 200"; exit 1

  # GitHub turns off scheduled workflows after 60 days with no commits.
  # This makes an empty commit whenever the last one is 30+ days old, so it never stops.
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit if needed
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%F)"
            git push
          fi
